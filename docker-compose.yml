services:
  costco-db:
    image: postgres:16
    container_name: costco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - costco_pg_data:/var/lib/postgresql/data

volumes:
  costco_pg_data:
